name: Daily returns

on:
  schedule:
    # 11:00 UTC Tue-Sat = 6 a.m. Central (5 a.m. in winter), capturing Mon-Fri closes
    - cron: "0 11 * * 2-6"
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Build returns table
        run: python update_returns.py

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/returns.csv
          git diff --cached --quiet || git commit -m "Update returns $(date -u +%F)"
          git push
